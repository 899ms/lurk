name: Deploy

# Stub. The hosted instance has no domain or Azure resource group yet, so the
# job is written out but never runs. Turning it on means removing `if: false`
# and setting the repository variables and secrets named below.
on:
  push:
    branches: [main]

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      IMAGE: reddit-leads
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        run: |
          az acr login --name "$REGISTRY"
          docker build -t "$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}" .
          docker push "$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}"

      - name: Roll the container app
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE:${{ github.sha }}"

      - name: Wait for the new revision to go healthy
        run: |
          az containerapp revision list \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?properties.active].{name:name,state:properties.runningState}" \
            --output table
